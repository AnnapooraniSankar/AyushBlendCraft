<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Booking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #45a049;
        }
        .message {
            font-size: 18px;
            margin-top: 20px;
            display: none;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
        .payment-options {
            margin-top: 20px;
        }
        .qr-code {
            width: 150px;
            display: none;
            margin: 10px auto;
        }
        .card-details {
            display: none;
        }
        .disabled {
            background-color: #f0f0f0;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Book an Appointment</h1>
        <form id="appointment-form" onsubmit="return validateForm(event)">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="date">Preferred Date:</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Preferred Time:</label>
            <input type="time" id="time" name="time" required>

            <label for="reason">Reason for Appointment:</label>
            <select id="reason" name="reason" required>
                <option value="">Select a reason</option>
                <option value="Consultation">Consultation</option>
                <option value="Follow-up">Follow-up</option>
                <option value="Emergency">Emergency</option>
            </select>

            <div class="payment-options">
                <h3>Select Payment Method</h3>
                <input type="radio" id="qr" name="payment" value="QR Code" required>
                <label for="qr">Pay via QR Code</label>
                <img src="QR.jpg" alt="QR Code" class="qr-code" id="qr-code">

                <input type="radio" id="card" name="payment" value="Card">
                <label for="card">Credit/Debit Card</label>

                <div class="card-details" id="card-details">
                    <input type="text" id="card-number" name="card-number" placeholder="Card Number" maxlength="16">
                    <input type="text" id="expiry-date" name="expiry-date" placeholder="MM/YYYY" maxlength="7">
                    <input type="text" id="cvv" name="cvv" placeholder="CVV" maxlength="3">
                </div>
            </div>

            <button type="submit">Book Appointment & Pay</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script>
        function validateForm(event) {
            event.preventDefault();
            const messageDiv = document.getElementById('message');
            messageDiv.style.display = 'none';
            messageDiv.className = 'message';

            const name = document.getElementById('name').value.trim();
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const reason = document.getElementById('reason').value;
            const paymentMethod = document.querySelector('input[name="payment"]:checked');

            if (!name || !date || !time || !reason || !paymentMethod) {
                showMessage('All fields including payment are required.', 'error');
                return false;
            }

            if (paymentMethod.value === 'Card') {
                const cardNumber = document.getElementById('card-number').value.trim();
                const expiryDate = document.getElementById('expiry-date').value.trim();
                const cvv = document.getElementById('cvv').value.trim();

                if (!/^\d{16}$/.test(cardNumber)) {
                    showMessage('Invalid card number. Must be 16 digits.', 'error');
                    return false;
                }

                if (!/^(0[1-9]|1[0-2])\/\d{4}$/.test(expiryDate)) {
                    showMessage('Invalid expiry date. Use MM/YYYY format.', 'error');
                    return false;
                }

                if (!/^\d{3}$/.test(cvv)) {
                    showMessage('Invalid CVV. Must be 3 digits.', 'error');
                    return false;
                }
            }

            showMessage('Appointment is successfully booked!', 'success');

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);

            return false;
        }

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = message;
            messageDiv.classList.add(type);
            messageDiv.style.display = 'block';
        }

        document.querySelectorAll('input[name="payment"]').forEach(payment => {
            payment.addEventListener('change', function() {
                const isQR = this.value === 'QR Code';
                const isCard = this.value === 'Card';

                document.getElementById('qr-code').style.display = isQR ? 'block' : 'none';
                document.getElementById('card-details').style.display = isCard ? 'block' : 'none';

                if (!isCard) {
                    document.getElementById('card-number').value = '';
                    document.getElementById('expiry-date').value = '';
                    document.getElementById('cvv').value = '';
                }
            });
        });
    </script>
</body>
</html>
